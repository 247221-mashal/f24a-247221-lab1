    <section id="one">
        <h2>Who</h2>
        <!-- Lab 1 -->

        <figure>
            <img src="photo.jpg" alt="My photo" width="200">
            <figcaption>My photo</figcaption>
        </figure>

        <ul>
            <li>First</li>
            <li>Second</li>
        </ul>
    </section>

   
<section id="two">

    <h2>Form</h2>

    <form>
 <fieldset>
            <legend>Your details</legend>

        <p>
            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Your name"
                required
            >
        </p>

        <p>
            <label for="pw">Password</label>
            <input
                type="password"
                id="pw"
                name="password"
            >
        </p>

        <p>
            <label for="em">Email</label>
            <input
                type="email"
                id="em"
                name="email"
            >
        </p>
        
        <p>
            <input
                type="checkbox"
                id="agree"
                name="agree"
                value="yes"
            >
            <label for="agree">I agree</label>
        </p>

        <p>
            Campus
            <br>

            <input
                type="radio"
                id="kharian"
                name="campus"
                value="kharian"
            >
            <label for="kharian">Kharian</label>

            <br>

            <input
                type="radio"
                id="islamabad"
                name="campus"
                value="islamabad"
            >
            <label for="islamabad">Islamabad</label>
        </p>

        <p>
            <label for="bio">Bio</label>
            <br>

            <textarea
                id="bio"
                name="bio"
                rows="3"
            ></textarea>
        </p>
        
        <p>
            <label for="day">Day</label>

            <select id="day" name="day">
                <option value="mon">Monday</option>
                <option value="tue">Tuesday</option>
                <option value="wed">Wednesday</option>
            </select>
        </p>

        <p>
            <label for="city">City</label>

            <input
                type="text"
                id="city"
                name="city"
                list="cities"
            >

            <datalist id="cities">
                <option value="Kharian">
                <option value="Gujrat">
            </datalist>
        </p>
        <p>
                <label for="dob">Date</label>
                <input type="date" id="dob" name="dob">
            </p>

            <p>
                <label for="n">Number</label>
                <input type="number" id="n" name="seats" min="1" max="40">
            </p>

            <p>
                <label for="col">Colour</label>
                <input type="color" id="col" name="col" value="#1a2744">
            </p>

            <p>
                <label for="vol">Range</label>
                <input type="range" id="vol" name="vol" min="0" max="10">
            </p>

            <p>
                <label for="cv">File</label>
                <input type="file" id="cv" name="cv">
            </p>

            <p>
                <button type="submit">Send</button>
                <button type="reset">Clear</button>
            </p>

        </fieldset>
    </form>
 <table border="1">
        <thead>
            <tr>
                <th>File</th>
                <th>Job</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>index.html</td>
                <td>Structure</td>
            </tr>
            <tr>
                <td>styles.css</td>
                <td>Look</td>
            </tr>
        </tbody>
    </table>
</section>
